[project]
name = "uchr"
version = "1.1.0"
description = "Unicode character tools"
authors = [{ name = "Miki Yutani", email = "mkyutani@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["unicode", "character", "tools", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.25.0,<3"]

[project.urls]
Homepage = "https://github.com/mkyutani/uchr"
Repository = "https://github.com/mkyutani/uchr"

[project.scripts]
uchr = "uchr.uchr:uchr"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501"]  # Line too long (handled by ruff format)
