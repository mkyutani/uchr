name: Release

# Pushing a tag vX.Y.Z (matching the version in pyproject.toml) runs:
# test -> build -> TestPyPI -> install check from TestPyPI
# -> PyPI (gated by the `pypi` environment) -> GitHub Release.
# Uploads use PyPI Trusted Publishing (OIDC); no API tokens are stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        id: version
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/uchr/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Dependencies (requests) come from PyPI; only uchr from TestPyPI.
          # The new release can take a moment to appear in the index.
          for i in 1 2 3 4 5 6; do
            if python -m pip install --no-cache-dir \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "uchr==${VERSION}"; then
              break
            fi
            if [ "$i" = 6 ]; then exit 1; fi
            sleep 20
          done
      - name: Smoke test
        run: |
          uchr --help
          uchr db --help

  publish-pypi:
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uchr/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
